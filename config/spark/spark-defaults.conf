# spark-defaults.conf
# Configuration Spark pour le pipeline Big Data

spark.master                     spark://spark-master:7077
spark.driver.memory              1g
spark.executor.memory            1g
spark.executor.cores             1

# Kafka + PostgreSQL packages (chargés automatiquement)
spark.jars.packages              org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.4,org.postgresql:postgresql:42.6.0

# HDFS
spark.hadoop.fs.defaultFS        hdfs://namenode:9000

# Optimisations adaptatives
spark.sql.adaptive.enabled                        true
spark.sql.adaptive.coalescePartitions.enabled     true
spark.sql.adaptive.skewJoin.enabled               true

# Streaming
spark.sql.streaming.checkpointLocation            hdfs://namenode:9000/checkpoints
spark.sql.streaming.forceDeleteTempCheckpointLocation  true

# Logs
spark.eventLog.enabled           false
