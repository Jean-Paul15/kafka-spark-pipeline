# Pile unique du pipeline de streaming.
#
#   docker compose up -d                          -> socle : Kafka, Kafka UI, cluster Spark
#   docker compose --profile immobilier up -d     -> + Redis, producteurs, job Spark, Streamlit
#   docker compose --profile analytics up -d      -> + HDFS, PostgreSQL, Grafana, job Spark -> PostgreSQL
#   docker compose --profile superset up -d       -> + Superset
#
# Les variables sont lues dans le fichier .env (voir .env.example).

name: kafka-spark-pipeline

x-spark-build: &spark-build
  context: ./docker/spark
  dockerfile: Dockerfile

networks:
  pipeline-net:
    driver: bridge

volumes:
  namenode_data:
  datanode_data:
  postgres_data:
  grafana_data:
  superset_data:

services:
  # ───────────────────────── Socle commun ─────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    networks: [pipeline-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    networks: [pipeline-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 45s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    networks: [pipeline-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      for t in annonces prix transactions ecommerce_transactions nyc_taxi_trips weather_realtime; do
        kafka-topics --create --if-not-exists --topic $$t --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1
      done
      kafka-topics --list --bootstrap-server kafka:29092
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks: [pipeline-net]
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: on-failure

  spark-master:
    build: *spark-build
    networks: [pipeline-net]
    environment:
      SPARK_MODE: master
    ports:
      - "8090:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 10s
      retries: 10

  spark-worker:
    build: *spark-build
    networks: [pipeline-net]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    ports:
      - "8091:8081"

  # ──────────── Profil « immobilier » : Spark -> Redis -> Streamlit ────────────
  redis:
    image: redis:7-alpine
    profiles: [immobilier]
    networks: [pipeline-net]
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  producer-annonces: &producer-immobilier
    profiles: [immobilier]
    build:
      context: ./src/producers
      dockerfile: ../../docker/producers/Dockerfile
    networks: [pipeline-net]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
      TOPIC: annonces
      PRODUCER_TYPE: annonces
    restart: unless-stopped

  producer-prix:
    <<: *producer-immobilier
    environment:
      KAFKA_BROKER: kafka:29092
      TOPIC: prix
      PRODUCER_TYPE: prix

  producer-transactions:
    <<: *producer-immobilier
    environment:
      KAFKA_BROKER: kafka:29092
      TOPIC: transactions
      PRODUCER_TYPE: transactions

  spark-immobilier:
    build: *spark-build
    profiles: [immobilier]
    networks: [pipeline-net]
    depends_on:
      spark-worker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPARK_MODE: immobilier
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./src/spark:/opt/spark-apps:ro
    ports:
      - "4040:4040"
    restart: unless-stopped

  dashboard:
    profiles: [immobilier]
    build:
      context: ./src/dashboard
      dockerfile: ../../docker/dashboard/Dockerfile
    networks: [pipeline-net]
    depends_on:
      - spark-immobilier
      - redis
    ports:
      - "8501:8501"
    environment:
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: [immobilier]
    networks: [pipeline-net]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"

  # ──────── Profil « analytics » : HDFS, PostgreSQL, Grafana ────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    profiles: [analytics]
    networks: [pipeline-net]
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./config/hadoop/core-site.xml:/etc/hadoop/core-site.xml
      - ./config/hadoop/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
      - ./scripts/init-hdfs.sh:/docker-entrypoint-initdb.d/init-hdfs.sh
    environment:
      CLUSTER_NAME: bigdata-cluster
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870/"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    profiles: [analytics]
    networks: [pipeline-net]
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - datanode_data:/hadoop/dfs/data
      - ./config/hadoop/core-site.xml:/etc/hadoop/core-site.xml
      - ./config/hadoop/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    ports:
      - "9864:9864"

  postgres:
    image: postgres:15-alpine
    profiles: [analytics]
    networks: [pipeline-net]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/01_init_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./docker/02_kpi_tables.sql:/docker-entrypoint-initdb.d/02_kpi.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-postgres:
    build: *spark-build
    profiles: [analytics]
    networks: [pipeline-net]
    depends_on:
      spark-worker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPARK_MODE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      KAFKA_BOOTSTRAP_INTERNAL: kafka:29092
    volumes:
      - ./src/spark:/opt/spark-apps:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    restart: unless-stopped

  # Conteneur client pour les jobs batch : docker compose exec spark-client ...
  spark-client:
    build: *spark-build
    profiles: [analytics]
    networks: [pipeline-net]
    depends_on:
      - spark-worker
      - namenode
    environment:
      SPARK_MODE: idle
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - ./src/spark:/opt/spark-apps:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  grafana:
    image: grafana/grafana:10.2.0
    profiles: [analytics]
    networks: [pipeline-net]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3101:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ecommerce_dashboard.json
      GF_INSTALL_PLUGINS: grafana-worldmap-panel,grafana-piechart-panel
      POSTGRES_DB: ${POSTGRES_DB:-bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  superset:
    image: apache/superset:3.0.0
    container_name: superset
    profiles: [superset]
    networks: [pipeline-net]
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/app/superset_home
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?définir SUPERSET_SECRET_KEY dans .env}
      SUPERSET_HOME: /app/superset_home
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?définir SUPERSET_ADMIN_PASSWORD dans .env}
    user: root
    command: >
      bash -c "
        mkdir -p /app/superset_home &&
        chmod 777 /app/superset_home &&
        superset db upgrade &&
        superset fab create-admin --username $${SUPERSET_ADMIN_USER} --firstname Admin --lastname User --email admin@example.com --password $${SUPERSET_ADMIN_PASSWORD} 2>/dev/null || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads
      "
